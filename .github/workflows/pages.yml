name: Verified quickstarts and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    name: Run every published walkthrough
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    timeout-minutes: 30
    env:
      CI: 'true'
      OTEL_SDK_DISABLED: 'true'
      CREWAI_TRACING_ENABLED: 'false'
      LANGSMITH_TRACING: 'false'
      OPENAI_AGENTS_DISABLE_TRACING: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: '3.12'
      - name: Install Python environment manager
        run: python -m pip install uv==0.11.26
      - name: Install source dependencies and build the CLI
        run: |
          npm ci --ignore-scripts
          npm run check
          npm run build
          npm run docs:check
      - name: Execute the exact published command blocks in fresh workspaces
        env:
          NB_AGENT_PYTHON: ${{ steps.python.outputs.python-path }}
        run: npm run test:scenarios
      - name: Build and validate the branded static site
        run: |
          npm run site:build
          node --import tsx --test tests/site.test.ts
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the verified site only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify-and-build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
